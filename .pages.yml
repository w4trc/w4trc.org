media:
  input: public/images
  output: /images

# Field lists mirror the schemas in src/content.config.ts.
content:
  - name: posts
    label: Posts
    type: collection
    # Each post is a folder with an index.md (images can sit in a gallery/ subfolder).
    path: src/content/posts
    view:
      fields: [ title, date, draft ]
      sort:
        - { field: date, order: desc }
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: date, label: Date, type: date, required: true }
      - { name: author, label: Author, type: string }
      - { name: summary, label: "Summary (shown on cards and in search results, ~155 characters max)", type: text }
      - { name: image, label: Cover Image, type: image }
      - { name: tags, label: Tags, type: string, list: true }
      - { name: externalUrl, label: External Article URL (card links here instead), type: string }
      - { name: draft, label: Draft, type: boolean }
      - { name: body, label: Body, type: rich-text }

  - name: events
    label: Events
    type: collection
    path: src/content/events
    view:
      fields: [ title, date, location ]
      sort:
        - { field: date, order: desc }
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: date, label: Start, type: date, required: true, options: { time: true } }
      - { name: endDate, label: End, type: date, options: { time: true } }
      - { name: location, label: "Location — Venue (street, city, ST zip)", type: string }
      - { name: summary, label: Summary, type: text }
      - { name: cover, label: Cover Image, type: image }
      - { name: url, label: Link to another page instead (optional), type: string }
      - { name: rsvpUrl, label: RSVP URL, type: string }
      - { name: featured, label: Featured, type: boolean }
      - { name: noindex, label: Hide from search engines, type: boolean }
      - { name: body, label: Body, type: rich-text }

  - name: meetings
    label: Meetings
    type: collection
    path: src/content/meetings
    view:
      fields: [ title, datetime, topic ]
      sort:
        - { field: datetime, order: asc }
        - { field: date, order: asc }
        - { field: title, order: asc }
    default:
      sort:
        - { field: datetime, order: asc }
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: datetime, label: Date, type: date, required: true, options: { time: true } }
      - { name: location, label: Location, type: string, required: true }
      - { name: topic, label: Topic, type: string }
      - { name: desc, label: Description, type: string }
      - { name: signupUrl, label: Sign Up URL, type: string }
      - { name: body, label: Body, type: rich-text }

  - name: silentKeys
    label: Silent Keys
    type: collection
    path: src/content/silentKeys
    view:
      fields: [ callsign, name, years ]
    fields:
      - { name: name, label: Name, type: string, required: true }
      - { name: callsign, label: Callsign, type: string, required: true}
      - { name: years, label: Years, type: string, required: false }
      - { name: description, label: Description, type: string }
      - { name: obituaryUrl, label: Obituary URL, type: string }

  - name: presentations
    label: Presentations
    type: collection
    path: src/content/presentations
    view:
      fields: [ title, date, presenter ]
      sort:
        - { field: date, order: desc }
    default:
      sort:
        - { field: date, order: desc }
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: date, label: Date, type: date, required: true }
      - { name: presenter, label: Presenter, type: string, required: true }
      - { name: description, label: Description, type: string }
      - { name: meta_description, label: "Search Description (optional, ~155 characters max)", type: string }
      - { name: youtubeId, label: YouTube Video ID, type: string }
      - { name: slidesUrl, label: Slides URL, type: string }
      - { name: slidesEmbed, label: Slides Embed URL, type: string }
      - { name: cover, label: Cover Image, type: string }
      - { name: draft, label: Draft, type: boolean }
      - { name: body, label: Notes, type: rich-text }

  - name: officers
    label: Officers
    type: collection
    path: src/content/officers
    view:
      fields: [ position, callsign, name ]
    fields:
      - { name: position, label: Position, type: string, required: true }
      - { name: title, label: Name, type: string, required: true }
      - { name: callsign, label: Callsign, type: string, required: true}
      - { name: body, label: Biography, type: rich-text }